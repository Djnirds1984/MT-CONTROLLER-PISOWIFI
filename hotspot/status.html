<!DOCTYPE html>
<!--
  AIRCOINS NETFI — Status Page (post-login)
  Shows connected session info with live polling via /api/session.php.
  Dual-mode: router-native + external (SBC).
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AIRCOINS NETFI — Status</title>

<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/popper.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<script src="js/varbridge.js"></script>
</head>
<body>

<div class="piso-container">

    <!-- ── Banner ──────────────────────────────────────────────────────── -->
    <div class="piso-banner">
        <img src="assets/MainPic.PNG" alt="AIRCOINS NETFI">
        <h1>AIRCOINS NETFI</h1>
        <p>Piso WiFi Portal</p>
    </div>

    <!-- ── Status Card ─────────────────────────────────────────────────── -->
    <div class="piso-status-card">
        <div class="piso-status-label">Status</div>
        <div class="piso-status-value connected" id="statusText">CONNECTED</div>
        <div class="piso-info-row">
            <span>MAC: <strong id="macDisplay">$(mac)</strong></span>
            <span>IP: <strong id="ipDisplay">$(ip)</strong></span>
        </div>
    </div>

    <!-- ── Timer ───────────────────────────────────────────────────────── -->
    <div class="piso-timer">
        <div class="piso-timer-display" id="timerDisplay">00:00:00</div>
        <div class="piso-timer-label">Time Remaining</div>
    </div>

    <!-- ── Session Info ────────────────────────────────────────────────── -->
    <div class="piso-session-info">
        <div class="piso-session-row">
            <span class="piso-session-key">Username</span>
            <span class="piso-session-val" id="sessionUser">$(username)</span>
        </div>
        <div class="piso-session-row">
            <span class="piso-session-key">Uptime</span>
            <span class="piso-session-val" id="sessionUptime">0s</span>
        </div>
        <div class="piso-session-row">
            <span class="piso-session-key">Download</span>
            <span class="piso-session-val" id="sessionBytesIn">0 B</span>
        </div>
        <div class="piso-session-row">
            <span class="piso-session-key">Upload</span>
            <span class="piso-session-val" id="sessionBytesOut">0 B</span>
        </div>
        <div class="piso-session-row">
            <span class="piso-session-key">Time Left</span>
            <span class="piso-session-val" id="sessionTimeLeft">--</span>
        </div>
    </div>

    <!-- ── Actions ─────────────────────────────────────────────────────── -->
    <div class="piso-actions">
        <a href="$(link-logout)" class="piso-btn piso-btn-coin" id="disconnectBtn">DISCONNECT</a>
    </div>

    <!-- ── Footer ──────────────────────────────────────────────────────── -->
    <div class="piso-footer">
        Powered by <strong>AIRCOINS NETFI</strong>
    </div>

</div><!-- /.piso-container -->

<script>
(function ($) {
    "use strict";

    var pollInterval = null;
    var mac = (window.PORTAL && window.PORTAL.mac) || "$(mac)";
    var apiBase = (typeof sbcApiUrl !== "undefined" && sbcApiUrl) ? sbcApiUrl : "";

    // ── Format bytes ──────────────────────────────────────────────────
    function fmtBytes(bytes) {
        bytes = parseInt(bytes) || 0;
        if (bytes === 0) return "0 B";
        var units = ["B", "KB", "MB", "GB"];
        var i = 0;
        var val = bytes;
        while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
        return (i === 0 ? val : val.toFixed(1)) + " " + units[i];
    }

    // ── Format seconds to HH:MM:SS ────────────────────────────────────
    function fmtTime(secs) {
        secs = parseInt(secs) || 0;
        if (secs < 0) secs = 0;
        var h = Math.floor(secs / 3600);
        var m = Math.floor((secs % 3600) / 60);
        var s = secs % 60;
        return (h < 10 ? "0" : "") + h + ":" +
               (m < 10 ? "0" : "") + m + ":" +
               (s < 10 ? "0" : "") + s;
    }

    // ── Parse MikroTik time string to seconds ─────────────────────────
    function parseTime(str) {
        if (!str) return 0;
        str = String(str).trim();
        if (str === "" || str === "0") return 0;
        var total = 0;
        var match = str.match(/^(?:(\d+)d)?(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
        if (match) {
            total += (parseInt(match[1]) || 0) * 86400;
            total += (parseInt(match[2]) || 0) * 3600;
            total += (parseInt(match[3]) || 0) * 60;
            total += (parseInt(match[4]) || 0);
        }
        return total;
    }

    // ── Poll session ──────────────────────────────────────────────────
    function pollSession() {
        $.ajax({
            url: apiBase + "/api/session.php",
            method: "GET",
            data: { mac: mac },
            dataType: "json",
            timeout: 8000
        }).done(function (resp) {
            if (resp && resp.connected) {
                $("#statusText").text("CONNECTED").removeClass("disconnected").addClass("connected");
                $("#sessionUser").text(resp.user || "--");
                $("#sessionUptime").text(resp.uptime || "0s");
                $("#sessionBytesIn").text(fmtBytes(resp.bytes_in));
                $("#sessionBytesOut").text(fmtBytes(resp.bytes_out));

                if (resp.time_left) {
                    var secs = parseTime(resp.time_left);
                    $("#sessionTimeLeft").text(resp.time_left);
                    $("#timerDisplay").text(fmtTime(secs));
                }
            } else {
                // Disconnected
                $("#statusText").text("DISCONNECTED").removeClass("connected").addClass("disconnected");
                $("#timerDisplay").text("00:00:00");
                $("#sessionTimeLeft").text("--");
                if (pollInterval) clearInterval(pollInterval);
            }
        }).fail(function () {
            // Silently retry on next interval
        });
    }

    // ── Init ──────────────────────────────────────────────────────────
    $(document).ready(function () {
        pollSession();
        pollInterval = setInterval(pollSession, 10000); // poll every 10s
    });

})(jQuery);
</script>

</body>
</html>
