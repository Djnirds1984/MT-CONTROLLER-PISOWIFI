<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIRCOINS NETFI</title>
<link rel="stylesheet" href="assets/piso.css">
</head>
<body>
<!-- AIRCOINS NETFI logout page — router-native, no redirect. After
     logout the client is unauthenticated again, so $(link-login)
     re-enters the captive flow and RouterOS re-serves login.html
     (the portal) on the next request. -->
<div class="piso-wrap">
  <header class="piso-head">
    <h1 class="piso-brand">AIRCOINS NETFI</h1>
    <p class="piso-sub">You are logged out</p>
  </header>

  <div class="piso-info">$(if username)$(username) — $(uptime) online$(else)Session closed$(endif)</div>

  <section class="piso-card">
    <a class="piso-btn piso-btn-wide" href="$(link-login)">Connect again</a>
    <p class="piso-hint">Buy a new code or insert coins to get back online.</p>
  </section>
</div>
</body>
</html>
