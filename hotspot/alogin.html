<!DOCTYPE html>
<!--
  AIRCOINS NETFI — After-Login Redirect Page
  MikroTik shows this after successful authentication.
  Follows $(link-redirect) to the status page.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AIRCOINS NETFI — Connected</title>

<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/popper.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<script src="js/varbridge.js"></script>

<meta http-equiv="refresh" content="2; url=$(link-redirect)">
<script>
    setTimeout(function () {
        location.replace("$(link-redirect)");
    }, 2000);
</script>
</head>
<body>

<div class="piso-container">

    <div class="piso-banner">
        <img src="assets/MainPic.PNG" alt="AIRCOINS NETFI">
        <h1>AIRCOINS NETFI</h1>
        <p>Piso WiFi Portal</p>
    </div>

    <div class="piso-status-card">
        <div class="piso-status-label">Status</div>
        <div class="piso-status-value connected">CONNECTED</div>
    </div>

    <div style="text-align:center;padding:30px 0;">
        <p style="color:#4CAF50;font-size:18px;font-weight:600;">Login Successful!</p>
        <p style="color:#78909C;font-size:13px;">Redirecting to your session...</p>
    </div>

    <div class="piso-footer">
        Powered by <strong>AIRCOINS NETFI</strong>
    </div>

</div>

</body>
</html>
