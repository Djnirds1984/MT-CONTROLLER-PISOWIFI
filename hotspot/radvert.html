<!DOCTYPE html>
<!--
  AIRCOINS NETFI — Advertisement / Redirect Page (SBC-only)
  Shown between login and status. Auto-redirects to the status page.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AIRCOINS NETFI — Connecting...</title>

<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/popper.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="css/style.css">

<script>
(function () {
    "use strict";
    // If a redirect param is provided, use it; otherwise go to status page
    var qs = window.location.search.substring(1);
    var params = {};
    if (qs) {
        qs.split("&").forEach(function (pair) {
            var parts = pair.split("=");
            var key = decodeURIComponent(parts[0] || "");
            var val = decodeURIComponent(parts[1] || "");
            if (key) params[key] = val;
        });
    }
    var target = params.redirect || "status.html";
    setTimeout(function () { location.replace(target); }, 5000);
})();
</script>
</head>
<body>

<div class="piso-container">

    <div class="piso-banner">
        <img src="assets/MainPic.PNG" alt="AIRCOINS NETFI">
        <h1>AIRCOINS NETFI</h1>
        <p>Piso WiFi Portal</p>
    </div>

    <div class="piso-status-card">
        <div class="piso-status-label">Status</div>
        <div class="piso-status-value connected">CONNECTING...</div>
    </div>

    <div style="text-align:center;padding:30px 0;">
        <p style="color:#90A4AE;font-size:16px;">Welcome to AIRCOINS NETFI</p>
        <p style="color:#78909C;font-size:13px;">You will be redirected to your session shortly...</p>
    </div>

    <div class="piso-footer">
        Powered by <strong>AIRCOINS NETFI</strong>
    </div>

</div>

</body>
</html>
