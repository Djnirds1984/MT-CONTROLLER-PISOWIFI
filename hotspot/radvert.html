<html>
<head>
<meta http-equiv="refresh" content="2; url=$(link-orig)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>AIRCOINS NETFI - Advertisement</title>
<link rel="stylesheet" href="css/style.css">
<script>

    var popup = '';
    function openOrig() {
	if (window.focus) popup.focus();
	location.href = unescape('$(link-orig-esc)');
    }
    function openAd() {
	location.href = unescape('$(link-redirect-esc)');
    }
    function openAdvert() {
	if (window.name != 'hotspot_advert') {
		popup = open('$(link-redirect)', 'hotspot_advert', '');
		setTimeout("openOrig()", 1000);
		return;
	}
	setTimeout("openAd()", 1000);
    }
</script>
</head>
<body onLoad="openAdvert()">

    <div class="container">

        <!-- BANNER: gradient placeholder. To use a custom image, add
             style="background-image:url('img/banner.jpg');background-size:cover;background-position:center"
             to this div (see css/style.css .banner comment). -->
        <div class="banner">
            <div class="banner-overlay">
                <span class="banner-tag">AIRCOINS</span>
                <span class="banner-sub">NETFI</span>
            </div>
        </div>

        <div class="content">

            <div class="status-text connected">ADVERTISEMENT</div>

            <p class="redirect-msg">Opening advertisement&hellip;</p>

            <div class="spinner"></div>

            <p class="redirect-hint">If nothing happens, open <a href="$(link-redirect)" target="hotspot_advert">advertisement</a> manually.</p>

            <div class="footer">Powered by <a href="#">AIRCOINS NETFI</a>. &copy; All rights reserved</div>

        </div>
    </div>

    <!-- Chat bubble -->
    <button type="button" class="chat-bubble" title="Chat with us" onclick="alert('Chat support is coming soon!')">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </button>

</body>
</html>
