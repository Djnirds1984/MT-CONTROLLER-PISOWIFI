<!DOCTYPE html>
<!--
  AIRCOINS NETFI — Captive Portal Login Page (SBC-only)
  All context arrives via query params from the router-side redirect stub.
  No MikroTik $(var) template tags — this page is served exclusively by lighttpd.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AIRCOINS NETFI — Piso WiFi</title>

<!-- Config (must load first — globals read by core.js) -->
<script src="assets/js/config.js"></script>

<!-- Bootstrap 4 + jQuery -->
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/popper.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>

<!-- Portal CSS -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="piso-container">

    <!-- ── Banner ──────────────────────────────────────────────────────── -->
    <div class="piso-banner">
        <img src="assets/MainPic.PNG" alt="AIRCOINS NETFI">
        <h1>AIRCOINS NETFI</h1>
        <p>Piso WiFi Portal</p>
    </div>

    <!-- ── Status Card ─────────────────────────────────────────────────── -->
    <div class="piso-status-card">
        <div class="piso-status-label">Status</div>
        <div class="piso-status-value disconnected" id="statusText">DISCONNECTED</div>
        <div class="piso-info-row">
            <span>MAC: <strong id="macDisplay">--</strong></span>
            <span>IP: <strong id="ipDisplay">--</strong></span>
        </div>
    </div>

    <!-- ── Vendo Select ────────────────────────────────────────────────── -->
    <div class="piso-vendo-select" id="vendoSelectDiv">
        <label for="vendoSelected">Coin Slot</label>
        <select id="vendoSelected">
            <option value="" disabled selected>Loading...</option>
        </select>
    </div>

    <!-- ── Voucher Input ───────────────────────────────────────────────── -->
    <div class="piso-voucher-row">
        <input type="text" id="voucherInput" placeholder="Enter voucher code" autocomplete="off">
        <button class="piso-btn piso-btn-primary" id="connectBtn" style="width:auto;padding:12px 24px;">CONNECT</button>
    </div>

    <!-- ── Action Buttons ──────────────────────────────────────────────── -->
    <div class="piso-actions">
        <button class="piso-btn piso-btn-coin" id="insertBtn">INSERT COIN</button>
        <button class="piso-btn piso-btn-secondary" id="promoRateBtn">VIEW RATES</button>
    </div>

    <hr class="piso-divider">

    <!-- ── Member Login ────────────────────────────────────────────────── -->
    <div style="text-align:center;">
        <button class="piso-btn piso-btn-secondary" id="memberLoginBtn" style="max-width:200px;margin:0 auto;">MEMBER LOGIN</button>
    </div>

    <!-- ── Footer ──────────────────────────────────────────────────────── -->
    <div class="piso-footer">
        Powered by <strong>AIRCOINS NETFI</strong>
    </div>

</div><!-- /.piso-container -->

<!-- ═══════════════════════════════════════════════════════════════════════
     HIDDEN FORM — Voucher login (HTTP-PAP POST to router)
     Action and dst are set dynamically by the init script below.
     ═══════════════════════════════════════════════════════════════════════ -->
<form id="sendin" name="sendin" action="" method="post" style="display:none;">
    <input type="hidden" name="dst" value="">
    <input type="hidden" name="popup" value="true">
    <input type="hidden" name="username" value="">
    <input type="hidden" name="password" value="">
</form>

<!-- ═══════════════════════════════════════════════════════════════════════
     MEMBER LOGIN FORM — Username + password (HTTP-PAP POST to router)
     ═══════════════════════════════════════════════════════════════════════ -->
<form id="memberForm" name="memberForm" action="" method="post" style="display:none;">
    <input type="hidden" name="dst" value="">
    <input type="hidden" name="popup" value="true">
    <input type="hidden" name="username" value="">
    <input type="hidden" name="password" value="">
</form>

<!-- ═══════════════════════════════════════════════════════════════════════
     CORE JS — portal logic (vendo, voucher, login)
     ═══════════════════════════════════════════════════════════════════════ -->
<script src="assets/js/core.js"></script>

<!-- ═══════════════════════════════════════════════════════════════════════
     MODALS
     ═══════════════════════════════════════════════════════════════════════ -->

<!-- ── Insert Coin Modal ───────────────────────────────────────────────── -->
<div class="modal fade" id="insertCoinModal" tabindex="-1" role="dialog" data-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Insert Coin</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="piso-coin-display">
                    <div class="piso-coin-amount" id="totalCoin">0</div>
                    <div class="piso-coin-label">Coins Inserted</div>
                    <div class="piso-coin-time" id="totalTime">Waiting for coin...</div>
                </div>
                <div class="piso-coin-anim">
                    <img src="assets/insert-coin-animation.gif" alt="Insert Coin">
                </div>
            </div>
            <div class="modal-footer">
                <button class="piso-btn piso-btn-secondary" id="cancelTopUpBtn" style="flex:1;" data-dismiss="modal">CANCEL</button>
            </div>
        </div>
    </div>
</div>

<!-- ── Promo Rate Modal ────────────────────────────────────────────────── -->
<div class="modal fade" id="promoRateModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Promo Rates</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <div id="promoRateList">
                    <!-- Populated by core.js populatePromoRates() -->
                    <p style="text-align:center;color:#78909C;">Select a coin slot to view rates.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ── Member Login Modal ──────────────────────────────────────────────── -->
<div class="modal fade" id="memberLoginModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Member Login</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="piso-member-field">
                    <label for="memberUser">Username</label>
                    <input type="text" id="memberUser" placeholder="Enter username" autocomplete="off">
                </div>
                <div class="piso-member-field">
                    <label for="memberPass">Password</label>
                    <input type="password" id="memberPass" placeholder="Enter password">
                </div>
            </div>
            <div class="modal-footer">
                <button class="piso-btn piso-btn-primary" id="memberLoginSubmit" style="flex:1;">LOGIN</button>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     INIT — Parse query params from router stub, wire up forms
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
    "use strict";

    // ── Parse query string ────────────────────────────────────────────────
    var params = {};
    var qs = window.location.search.substring(1);
    if (qs) {
        qs.split("&").forEach(function (pair) {
            var parts = pair.split("=");
            var key = decodeURIComponent(parts[0] || "");
            var val = decodeURIComponent(parts[1] || "");
            if (key) params[key] = val;
        });
    }

    // ── Fill MAC / IP displays ────────────────────────────────────────────
    if (params.mac) document.getElementById("macDisplay").textContent = params.mac;
    if (params.ip)  document.getElementById("ipDisplay").textContent  = params.ip;

    // ── Build the SBC status page URL (absolute — router redirects here after login) ─
    var sbcBase = (typeof sbcApiUrl !== "undefined" && sbcApiUrl) ? sbcApiUrl : "";
    var statusUrl = sbcBase + "/status.html?mac=" + encodeURIComponent(params.mac || "")
                  + "&ip="  + encodeURIComponent(params.ip  || "")
                  + "&user=" + encodeURIComponent(params.user || "");

    // ── Wire up hidden login forms ────────────────────────────────────────
    var loginUrl = params.login || "";

    var sendin = document.getElementById("sendin");
    sendin.setAttribute("action", loginUrl);
    sendin.querySelector('input[name="dst"]').value = statusUrl;

    var memberForm = document.getElementById("memberForm");
    memberForm.setAttribute("action", loginUrl);
    memberForm.querySelector('input[name="dst"]').value = statusUrl;

    // ── Store logout URL for the status page ──────────────────────────────
    if (params.logout) {
        try { sessionStorage.setItem("aircoins_logout_url", params.logout); } catch (e) {}
    }

    // ── Show error from query param ───────────────────────────────────────
    if (params.err) {
        window.__loginError = params.err;
    }

    // ── Expose parsed params globally for core.js ─────────────────────────
    window.PORTAL_PARAMS = params;
})();
</script>

</body>
</html>
