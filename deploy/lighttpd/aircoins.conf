# ============================================================================
#  AIRCOINS NETFI — lighttpd site configuration (COMPLETE, self-contained)
#  File: deploy/lighttpd/aircoins.conf
# ----------------------------------------------------------------------------
#  Installed by deploy/scripts/install-sbc.sh as the MAIN lighttpd config
#  (/etc/lighttpd/lighttpd.conf). The stock Debian config is backed up first.
#
#  WHY SELF-CONTAINED (the single FastCGI approach we chose):
#    This file declares its own server.modules (including mod_fastcgi) and its
#    own fastcgi.server block pointing at the DEDICATED aircoins php-fpm socket
#    (see deploy/php-fpm/aircoins-pool.conf). We therefore DO NOT use Debian's
#    15-fastcgi-php.conf snippet (lighty-enable-mod fastcgi-php) — that would
#    declare a second, conflicting ".php" handler on the default www socket.
#    The install script does NOT run lighty-enable-mod fastcgi-php for exactly
#    this reason. Everything lighttpd needs is defined below.
#
#  PLACEHOLDERS (substituted with sed by install-sbc.sh):
#    @@PORTAL_DOCROOT@@  -> /var/www/aircoins/portal         (port 80 root)
#    @@ADMIN_DOCROOT@@   -> /var/www/aircoins/app/admin      (port 443 root)
#    @@API_DIR@@         -> /var/www/aircoins/app/api        (session.php dir)
#    @@FPM_SOCKET@@      -> /run/php/php<FPMVER>-fpm-aircoins.sock
#  Deployed directory layout these map onto (admin/, includes/, api/ MUST be
#  siblings so the PHP relative requires ../includes and ../../includes work):
#    /var/www/aircoins/portal            (hotspot/)   port 80 docroot
#    /var/www/aircoins/app/admin         (admin/)     port 443 docroot
#    /var/www/aircoins/app/includes      (includes/)  shared PHP core
#    /var/www/aircoins/app/api           (api/)       session.php
# ============================================================================

# ----------------------------------------------------------------------------
# Modules (order matters: mod_indexfile early, mod_fastcgi/openssl late)
# ----------------------------------------------------------------------------
server.modules = (
    "mod_indexfile",
    "mod_access",
    "mod_alias",
    "mod_redirect",
    "mod_rewrite",
    "mod_fastcgi",
    "mod_openssl",
)

# NOTE: mod_accesslog is intentionally NOT loaded. On SD-card SBCs the constant
# access-log writes cause avoidable flash wear, so request logging is disabled.

# ----------------------------------------------------------------------------
# Global server settings
# ----------------------------------------------------------------------------
server.port                 = 80
server.document-root        = "@@PORTAL_DOCROOT@@/"

server.username             = "www-data"
server.groupname            = "www-data"
server.pid-file             = "/run/lighttpd.pid"

# Low-resource tuning appropriate for a single-board computer.
server.max-connections      = 128
server.max-worker           = 1
server.event-handler        = "linux-sysepoll"
server.network-backend      = "linux-sendfile"

# Reasonable upload limits (matches php-fpm pool: post_max_size / upload_max).
server.upload-dirs          = ( "/var/cache/lighttpd/uploads" )

# Directory index preference for the captive portal.
index-file.names            = ( "login.html", "index.html", "status.html" )

# Basic MIME types so static portal assets (css/js/img/gif/svg) are served with
# correct Content-Type headers.
mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".htm"  => "text/html; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "application/javascript; charset=utf-8",
    ".json" => "application/json",
    ".svg"  => "image/svg+xml",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".gif"  => "image/gif",
    ".ico"  => "image/x-icon",
    ".mp3"  => "audio/mpeg",
    ".woff" => "font/woff",
    ".woff2"=> "font/woff2",
    ".txt"  => "text/plain; charset=utf-8",
    ""      => "application/octet-stream",
)

# Never serve these extensions as raw files.
static-file.exclude-extensions = ( ".php", ".inc", ".db", ".sqlite" )

# ----------------------------------------------------------------------------
# FastCGI -> PHP-FPM (the ONE chosen approach; dedicated aircoins socket).
#   broken-scriptfilename = enable : lets php-fpm receive the full script path
#                                    even for aliased URLs (e.g. /api/session.php
#                                    which lives OUTSIDE the port-80 docroot).
#   check-local            = disable: required so lighttpd forwards the request
#                                    to php-fpm instead of trying to stat the
#                                    file under the current docroot first
#                                    (critical for the /api alias below).
# ----------------------------------------------------------------------------
fastcgi.server = ( ".php" =>
    ((
        "socket"                 => "@@FPM_SOCKET@@",
        "broken-scriptfilename"  => "enable",
        "check-local"            => "disable",
        "disable-time"           => 0,
        "max-procs"              => 1,
    ))
)

# ============================================================================
#  PORT 80 — the client-facing captive portal (plain HTTP)
# ----------------------------------------------------------------------------
#  The portal is the docroot set above (@@PORTAL_DOCROOT@@). Two extra things
#  are scoped to plain-HTTP requests only (so they never interfere with the
#  admin site on :443):
#    1. An alias mapping /api/  ->  the repo api/ dir, so the status page's
#       fetch('/api/session.php?mac=...') resolves to app/api/session.php even
#       though that file is NOT inside the portal docroot. session.php then does
#       require_once __DIR__.'/../includes/...' which resolves to app/includes.
#    2. A 404 fallback to /login.html: any unknown captive-portal URL (the OS
#       "connectivity check" probes, /generate_204, /hotspot-detect.html, etc.)
#       is served the login page. The browser keeps the ORIGINAL path+query in
#       its address bar, so js/varbridge.js still reads ?mac=&ip=&dst=... from
#       location.search client-side.
# ============================================================================
$HTTP["scheme"] == "http" {
    alias.url += ( "/api/" => "@@API_DIR@@/" )
    server.error-handler-404 = "/login.html"
}

# ============================================================================
#  PORT 443 — the admin panel (self-signed TLS)
# ----------------------------------------------------------------------------
#  docroot = app/admin/ so that:
#    /                -> admin/            (index-file.names -> login.php)
#    /login.php       -> admin/login.php
#    /routers.php     -> admin/routers.php
#    /assets/...      -> admin/assets/...   (relative URLs used by the admin UI)
#    /api/monitor.php -> admin/api/monitor.php (inside docroot; NOT aliased here
#                        because the /api alias above is scoped to http only).
#  Admin PHP still reaches the shared core via ../includes (admin/ and includes/
#  are siblings under app/) and ../../includes from admin/api/monitor.php.
# ============================================================================
$SERVER["socket"] == ":443" {
    ssl.engine             = "enable"
    ssl.pemfile            = "/etc/lighttpd/certs/aircoins.pem"
    # Modern, safe cipher defaults (lighttpd >= 1.4.56 honours these).
    ssl.openssl.ssl-conf-cmd = ("Protocol" => "-ALL, TLSv1.2, TLSv1.3")

    server.document-root   = "@@ADMIN_DOCROOT@@/"
    index-file.names       = ( "login.php", "index.php" )

    # Clean URLs: visit /hotspot instead of /hotspot.php.
    # Only rewrites paths that have NO file extension, so static assets
    # (/assets/admin.css, /assets/admin.js, /favicon.ico) are untouched.
    url.rewrite-once = (
        "^/([^.]+)$" => "/$1.php",
    )

    # .php is handled by the global fastcgi.server block above (php-fpm).
}

# ============================================================================
#  OPTIONAL VARIANT — admin on PORT 80 under /admin with an IP allowlist
# ----------------------------------------------------------------------------
#  Some operators must keep everything on port 80 (no TLS listener available,
#  or a single-port firewall rule). UNCOMMENT the block below to expose the
#  admin panel at http://<SBC_IP>/admin/ and restrict it to private LAN ranges.
#
#  WARNING: over plain HTTP the admin login and all traffic (including router
#  credentials entered in the UI) are sent in CLEARTEXT. Only use this on a
#  fully trusted, isolated management network. The port-443 TLS site above is
#  the recommended default. If you enable this variant you may also comment out
#  the ":443" socket block above.
#
#  The admin UI uses relative URLs (assets/..., api/monitor.php, routers.php),
#  all of which resolve correctly under the /admin/ prefix, and the PHP
#  ../includes requires still work because they are filesystem paths.
# ----------------------------------------------------------------------------
