; ============================================================================
;  AIRCOINS NETFI — PHP-FPM pool for the SBC (low-memory, on-demand)
;  File: deploy/php-fpm/aircoins-pool.conf
; ----------------------------------------------------------------------------
;  Installed by deploy/scripts/install-sbc.sh to:
;      /etc/php/<FPMVER>/fpm/pool.d/aircoins.conf
;  (e.g. /etc/php/8.2/fpm/pool.d/aircoins.conf on Debian bookworm,
;        /etc/php/8.3/fpm/pool.d/aircoins.conf on Ubuntu 24.04 noble)
;
;  PLACEHOLDER: @@FPMVER@@ in the listen= path is replaced with the detected
;  PHP major.minor version by the install script (sed). It MUST match the
;  @@FPM_SOCKET@@ value that install-sbc.sh writes into aircoins.conf:
;      /run/php/php@@FPMVER@@-fpm-aircoins.sock
;
;  This is a DEDICATED pool on its OWN socket, separate from Debian's default
;  "www" pool (which listens on /run/php/php<FPMVER>-fpm.sock). Keeping it
;  separate avoids clobbering any stock config and makes the AIRCOINS runtime
;  limits explicit. lighttpd connects to THIS socket via fastcgi.server.
; ============================================================================

[aircoins]

; Run as the web-server user so lighttpd (www-data) can reach the socket and
; the PHP process can read /var/www/aircoins, /var/lib/aircoins and
; /etc/aircoins/secret.key (all owned by www-data).
user  = www-data
group = www-data

; UNIX socket (preferred over TCP on a single host: no network overhead).
listen = /run/php/php@@FPMVER@@-fpm-aircoins.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Backlog sized for a small SBC.
listen.backlog = 128

; --- Process manager --------------------------------------------------------
; ondemand: workers are spawned only when a request arrives and reaped when
; idle. This keeps the RAM footprint near zero between admin hits, which is
; exactly what we want on a shared SBC that also runs the captive portal.
pm                     = ondemand
pm.max_children        = 5
pm.process_idle_timeout = 10s
pm.max_requests        = 500

; --- PHP runtime limits (admin_value: cannot be overridden by scripts) ------
php_admin_value[memory_limit]       = 32M
php_admin_value[post_max_size]      = 2M
php_admin_value[upload_max_filesize]= 2M
php_admin_value[max_execution_time] = 30

; --- Hardening / hygiene ----------------------------------------------------
php_admin_value[expose_php]   = Off
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode]  = 1
; Keep admin sessions inside our data dir (also covered by open_basedir below).
; install-sbc.sh creates /var/lib/aircoins/sessions owned by www-data (0700).
php_admin_value[session.save_path] = /var/lib/aircoins/sessions
php_admin_flag[log_errors]    = On
php_admin_value[error_log]    = /var/log/php-fpm-aircoins.log
; Never display errors to the browser in production.
php_admin_flag[display_errors] = Off

; --- Slow log (helps diagnose a stuck router API call) ----------------------
; Uncomment to trace requests slower than 5s:
; request_slowlog_timeout = 5s
; slowlog = /var/log/php-fpm-aircoins-slow.log

; Restrict the pool's file access to the deployed app + data dirs (optional but
; recommended). Comment out if you relocate the app.
php_admin_value[open_basedir] = /var/www/aircoins:/var/lib/aircoins:/etc/aircoins:/tmp:/var/cache/lighttpd:/var/log/php-fpm-aircoins.log
