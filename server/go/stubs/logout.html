<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi</title>
</head>
<body>
<p>You are logged out.</p>
<script>
/* Carry the hotspot context (mac, ip, router login URL) back to the
   portal so "buy a new code" / "insert coins" can log in again.
   Without these params the portal dead-ends with "Login URL missing". */
var q = '?logged_out=1' +
        '&mac=' + encodeURIComponent('$(mac)') +
        '&ip=' + encodeURIComponent('$(ip)') +
        '&link-login=' + encodeURIComponent('$(link-login-only)');
location.replace('{{SBC_URL}}/' + q);
</script>
<!-- AIRCOINS-STUB logout v1 — thin redirector only. -->
</body>
</html>
