# AIRCOINS NETFI — lighttpd site (single port 80).
#
# Installed to /etc/lighttpd/conf-available/60-aircoins.conf and enabled
# with `lighty-enable-mod aircoins`. install.sh substitutes the placeholders
# below and refuses to deploy a file that still contains one.
#
#   @@PORTAL_DOCROOT@@  directory with index.html + status.html + assets/
#   @@ADMIN_DOCROOT@@   directory with the admin SPA (index.html + assets/)
#
# Everything lives on port 80: the captive portal at /, the admin panel
# under /admin (protected by its own login: bcrypt credentials, server-side
# sessions, CSRF header, per-IP throttling), and the JSON API under /api/
# proxied to the aircoind service on loopback. No PHP anywhere.
#
# NOTE: server.port is NOT set here — the stock lighttpd.conf already
# declares it and lighttpd rejects duplicate global assignments from
# conf-enabled includes. install.sh comments out the stock
# server.document-root so this file is the sole authority for the docroot.

# ---------------------------------------------------------------------------
# Captive portal: pure static files at /
# ---------------------------------------------------------------------------
server.document-root = "@@PORTAL_DOCROOT@@"
server.dir-listing   = "disable"
index-file.names    += ("index.html", "status.html")

# ---------------------------------------------------------------------------
# Admin SPA: served from its own tree under /admin
# ---------------------------------------------------------------------------
server.modules += ("mod_alias")
alias.url = ( "/admin" => "@@ADMIN_DOCROOT@@" )

# ---------------------------------------------------------------------------
# JSON API: proxied to aircoind (systemd unit binds 127.0.0.1:8088)
# ---------------------------------------------------------------------------
server.modules += ("mod_proxy")
proxy.server = ( "/api/" => (
	( "host" => "127.0.0.1", "port" => 8088 )
) )
