<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session status</title>
<link rel="stylesheet" href="/assets/piso.css">
</head>
<body>
<div class="piso-wrap">
  <header class="piso-head">
    <h1 class="piso-brand">Session</h1>
    <p class="piso-sub" id="stateLine">Checking your connection...</p>
  </header>

  <div class="piso-card">
    <div class="piso-kv"><span>User</span><b id="userLine">-</b></div>
    <div class="piso-kv"><span>Device</span><b id="macLine">-</b></div>
    <div class="piso-kv"><span>IP</span><b id="ipLine">-</b></div>
    <div class="piso-kv"><span>Online for</span><b id="uptimeLine">-</b></div>
    <div class="piso-kv"><span>Time left</span><b id="leftLine">-</b></div>
  </div>

  <button id="logoutBtn" class="piso-btn piso-btn-wide piso-btn-danger" type="button" hidden>Logout</button>
  <a class="piso-backlink" href="/">Back to portal</a>
</div>

<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var ip = Q.get('ip') || '';
  var mac = (Q.get('mac') || '').toUpperCase();
  var logoutUrl = Q.get('logout') || '';

  function text(id, v) { document.getElementById(id).textContent = v; }
  text('macLine', mac || '-');
  text('ipLine', ip || '-');
  if (Q.get('user')) text('userLine', Q.get('user'));
  if (Q.get('uptime')) text('uptimeLine', Q.get('uptime'));

  var lb = document.getElementById('logoutBtn');
  if (logoutUrl) {
    lb.hidden = false;
    lb.addEventListener('click', function () {
      window.location.href = logoutUrl;
    });
  }

  // RouterOS time strings: 1w2d3h4m5s
  function parseMT(s) {
    if (!s) return null;
    var m = String(s).match(/(\d+w)?(\d+d)?(\d+h)?(\d+m)?(\d+s)?/);
    if (!m) return null;
    var sec = 0;
    if (m[1]) sec += parseInt(m[1], 10) * 604800;
    if (m[2]) sec += parseInt(m[2], 10) * 86400;
    if (m[3]) sec += parseInt(m[3], 10) * 3600;
    if (m[4]) sec += parseInt(m[4], 10) * 60;
    if (m[5]) sec += parseInt(m[5], 10);
    return sec;
  }

  function hms(total) {
    total = Math.max(0, total | 0);
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  var leftSecs = parseMT(Q.get('left'));

  function poll() {
    if (!ip) { return; }
    fetch('/api/session?ip=' + encodeURIComponent(ip), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById('stateLine').textContent =
          d.online === true ? 'Connected' : (d.online === false ? 'Not connected' : 'Router status unavailable');
        if (d.online === true) {
          text('userLine', d.user || '-');
          if (d.mac) text('macLine', String(d.mac).toUpperCase());
          if (d.uptime) text('uptimeLine', d.uptime);
          if (d.time_left !== undefined) {
            leftSecs = parseMT(d.time_left);
            if (leftSecs === null) text('leftLine', d.time_left);
          }
          if (!logoutUrl && d.user) { /* logout stays hidden without router link */ }
        } else if (d.online === false) {
          text('leftLine', 'expired');
        }
      })
      .catch(function () { /* keep last state */ });
  }

  setInterval(function () {
    if (leftSecs !== null && leftSecs > 0) {
      leftSecs -= 10;
      text('leftLine', hms(leftSecs));
    }
  }, 10000);

  poll();
  setInterval(poll, 10000);
})();
</script>
</body>
</html>
